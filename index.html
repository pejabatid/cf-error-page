<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#052a26">
  <title>Verifikasi | pejabat.id</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300796b'/%3E%3C/svg%3E">
  <!--
    Cloudflare Error Pages: Managed Challenge / I'm Under Attack Mode.
    dash.cloudflare.com → zone pejabat.id → Error Pages
    → Managed Challenge / I'm Under Attack Mode → Custom page.
    Fetch dari URL yang tidak kena UAM. Placeholder widget CF wajib tepat satu kali.
    Jangan aset origin. Jangan kotak di sekitar widget. Jangan opsi challenge di skrip sendiri.
  -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #052a26;
      color: #e8f5f2;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    .wrap {
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #4db6ac;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 0.94rem;
      line-height: 1.5;
      color: rgba(224, 242, 241, .64);
      margin-bottom: 22px;
    }
    .challenge-widget {
      display: flex;
      justify-content: center;
      background: none;
      border: 0;
      padding: 0;
      min-height: 0;
    }
    .meta {
      margin-top: 28px;
      font-size: 11px;
      line-height: 1.55;
      color: rgba(224, 242, 241, .44);
    }
    .meta code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      color: rgba(224, 242, 241, .64);
    }
    noscript .noscript-warning {
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: rgba(224, 242, 241, .64);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">pejabat.id</div>
    <h1>Verifikasi</h1>
    <p class="sub">Satu detik saja.</p>
    <noscript>
      <div class="noscript-warning">Aktifkan JavaScript dan cookie untuk membuka situs ini.</div>
    </noscript>
    <div class="challenge-widget">
      ::CF_WIDGET_BOX::
    </div>
    <div class="meta">
      Cloudflare<br>
      Ray ID: <code>::RAY_ID::</code>
    </div>
  </div>
</body>
</html>
