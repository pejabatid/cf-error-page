<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#004d40">
  <title>Pemeriksaan keamanan | pejabat.id</title>
  <!--
    Cloudflare Error Pages: Managed Challenge / I'm Under Attack Mode.
    dash.cloudflare.com → zone pejabat.id → Error Pages → Custom page.
    Host fetch: https://pejabatid.github.io/cf-error-page/
    Git push tidak mengubah snapshot CF. Placeholder widget tepat satu kali.
    Jangan aset origin. Jangan opsi challenge di skrip sendiri.
  -->
  <style>
    /* Local copies of the site's Inter fonts; Cloudflare inlines these assets. */
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("Inter-Regular.ttf") format("truetype");
    }
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("Inter-Bold.ttf") format("truetype");
    }
    :root {
      color-scheme: dark;
      --edge-background: #004d40;
      --edge-primary: #005f56;
      --edge-deep: #003d36;
      --edge-ink: #fff;
      --edge-muted: #c1dcd6;
    }

    html { min-height: 100%; background: var(--edge-background); }
    body {
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 48px 24px 24px;
      display: flex;
      flex-direction: column;
      background: linear-gradient(130deg, var(--edge-deep), var(--edge-background) 55%, var(--edge-primary));
      color: var(--edge-ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .pjbt-edge-main {
      box-sizing: border-box;
      width: 100%;
      max-width: 640px;
      margin: auto;
      padding: 40px 0 56px;
      text-align: center;
    }
    .pjbt-edge-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0 auto;
    }
    .pjbt-edge-logo {
      display: block;
      flex: 0 0 auto;
      width: 128px;
      height: 128px;
    }
    .pjbt-edge-wordmark {
      display: block;
      width: 240px;
      max-width: calc(100% - 138px);
      height: auto;
    }
    .pjbt-edge-rule {
      height: 1px;
      margin: 36px 24px;
      border: 0;
      background: rgba(224, 242, 241, 0.18);
    }
    .pjbt-edge-title {
      margin: 0 0 12px;
      font-size: clamp(23px, 2.3vw, 28px);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.35;
      text-wrap: balance;
    }
    .pjbt-edge-description {
      max-width: 410px;
      margin: 0 auto;
      color: var(--edge-muted);
      font-size: 15px;
      line-height: 1.65;
      text-wrap: pretty;
    }
    .pjbt-edge-description-sub {
      margin-top: 8px;
    }
    .pjbt-edge-widget {
      box-sizing: border-box;
      width: 100%;
      max-width: 520px;
      margin: 28px auto 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: var(--edge-ink);
      font-family: inherit;
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
    }
    .pjbt-edge-help {
      max-width: 380px;
      margin: 20px auto 0;
      color: var(--edge-muted);
      font-size: 13px;
      line-height: 1.65;
    }
    .pjbt-edge-noscript {
      box-sizing: border-box;
      max-width: 520px;
      margin: 24px auto 0;
      padding: 16px 20px;
      border: 1px solid #4db6ac;
      border-radius: 8px;
      color: var(--edge-ink);
      font-size: 15px;
      line-height: 1.6;
    }
    .pjbt-edge-footer {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 24px;
      color: var(--edge-muted);
      text-align: center;
      font-size: 11px;
      line-height: 1.6;
    }
    .pjbt-edge-footer p { margin: 0; }
    .pjbt-edge-ray {
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      overflow-wrap: anywhere;
    }
    @media (max-width: 480px) {
      body { padding: 28px 10px 20px; }
      .pjbt-edge-main { padding: 24px 0 40px; }
      .pjbt-edge-brand { gap: 4px; }
      .pjbt-edge-logo { width: 88px; height: 88px; }
      .pjbt-edge-wordmark { width: 168px; max-width: calc(100% - 92px); }
      .pjbt-edge-rule { margin: 30px 16px; }
      .pjbt-edge-title,
      .pjbt-edge-description,
      .pjbt-edge-help { padding-right: 12px; padding-left: 12px; }
      .pjbt-edge-widget { margin-top: 24px; padding: 0; }
      .pjbt-edge-footer { flex-direction: column; gap: 4px; }
    }
  </style>
</head>
<body>
  <main class="pjbt-edge-main" aria-labelledby="pjbt-edge-heading">
    <div class="pjbt-edge-brand">
      <img class="pjbt-edge-logo" src="pejabat-id-logo-3d-transparan.png" width="4030" height="4030" alt="">
      <img class="pjbt-edge-wordmark" src="pejabat-id-wordmark-putih.png" width="3600" height="759" alt="pejabat.id">
    </div>
    <hr class="pjbt-edge-rule">
    <h1 class="pjbt-edge-title" id="pjbt-edge-heading">Memastikan anda bukan BOT</h1>
    <p class="pjbt-edge-description">Mohon tunggu sebelum melanjutkan ke pejabat.id</p>
    <p class="pjbt-edge-description pjbt-edge-description-sub">Ikuti petunjuk verifikasi jika diminta.</p>
    <noscript>
      <p class="pjbt-edge-noscript">Aktifkan JavaScript dan izinkan cookie pada browser Anda untuk melanjutkan pemeriksaan.</p>
    </noscript>
    <!-- Style only our wrapper. Cloudflare owns the widget, its iframe, and verification results. -->
    <div class="pjbt-edge-widget" role="group" aria-label="Verifikasi keamanan Cloudflare">
      ::CF_WIDGET_BOX::
    </div>
    <p class="pjbt-edge-help">Halaman terbuka otomatis setelah pemeriksaan berhasil.</p>
  </main>
  <footer class="pjbt-edge-footer">
    <p>pejabat.id dilindungi oleh Cloudflare</p>
    <p>Ray ID: <span class="pjbt-edge-ray">::RAY_ID::</span></p>
  </footer>
</body>
</html>
